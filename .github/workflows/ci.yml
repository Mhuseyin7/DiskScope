name: CI
on: [push, pull_request]
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt,clippy" }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: apps/desktop/package-lock.json }
      - run: cargo fmt --all -- --check
      # The desktop shell needs WebKit system libraries on Linux. Core filesystem
      # crates remain platform-neutral and are verified here; native bundles run
      # in dedicated platform packaging jobs.
      - run: cargo clippy --workspace --exclude diskscope-desktop --all-targets -- -D warnings
      - run: cargo test --workspace --exclude diskscope-desktop
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run lint
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
